name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Never paste real tokens or credentials here; redact them from any output.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest program or test that shows the problem.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-go-next version
      placeholder: v0.1.0 or a commit
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      description: Output of `go version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - Streamable HTTP
        - in-memory (mcptest)
        - custom
        - not transport related
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      render: shell
