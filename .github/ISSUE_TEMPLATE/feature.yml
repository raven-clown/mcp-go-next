name: Feature request
description: Suggest something mcp-go-next should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, ideally as the Go code you would like to write.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways around it, in this library or others.
  - type: input
    id: row
    attributes:
      label: Feature matrix row
      description: The row ID from the feature matrix in docs/design.md, if one fits (for example S11).
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
